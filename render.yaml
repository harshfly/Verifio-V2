services:
  - type: web
    name: verifio-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt && python -c \"import nltk; nltk.download('punkt_tab')\""
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
